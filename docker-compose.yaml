services:
  qrnroll:
    build: .
    ports:
      - '8080:8080'
    environment:
      # - WEBHOOK_URLS=https://discord.com/api/webhooks/...
      - VALKEY_URL=valkey://valkey:6379
    restart: unless-stopped
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:9.1.4-alpine@sha256:56729e68bdda139cbd3f6a2538683dc3523325fc5711ea1a379938f1b37893f0
    ports:
      - '6379:6379'
    restart: unless-stopped
