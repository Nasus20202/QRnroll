services:
  qrnroll:
    build: .
    ports:
      - '8080:8080'
    environment:
      # - WEBHOOK_URLS=https://discord.com/api/webhooks/...
      - VALKEY_URL=valkey://valkey:6379
    restart: unless-stopped
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    ports:
      - '6379:6379'
    restart: unless-stopped
