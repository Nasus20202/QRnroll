services:
  qrnroll:
    build: .
    ports:
      - '8080:8080'
    environment:
      # - WEBHOOK_URLS=https://discord.com/api/webhooks/...
      - VALKEY_URL=valkey://valkey:6379
    restart: unless-stopped
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    ports:
      - '6379:6379'
    restart: unless-stopped
