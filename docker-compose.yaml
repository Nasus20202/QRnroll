services:
  qrnroll:
    build: .
    ports:
      - '8080:8080'
    environment:
      # - WEBHOOK_URLS=https://discord.com/api/webhooks/...
      - VALKEY_URL=valkey://valkey:6379
    restart: unless-stopped
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:9.2.0-alpine@sha256:4d67e1af80c653bd46c0bbe8de438c81a6535ab5a39b22f2100028f314005663
    ports:
      - '6379:6379'
    restart: unless-stopped
